<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="60" y1="20" x2="452" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2130"/>
      <stop offset="0.55" stop-color="#111621"/>
      <stop offset="1" stop-color="#080a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="392" cy="128" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#34d399" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="120" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="72" y1="380" x2="424" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e9f66"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#8ff2cf"/>
    </linearGradient>
    <radialGradient id="dot" cx="424" cy="124" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcece3"/>
    </radialGradient>
    <linearGradient id="areaFadeGrad" x1="330" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
  </defs>
  <mask id="areaFade" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
    <rect x="0" y="0" width="512" height="512" fill="url(#areaFadeGrad)"/>
  </mask>

  <!-- background fills the full square -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- everything else is scaled down + centered so it survives Android's circular/squircle crop
       (W3C maskable-icon safe zone: keep artwork inside the centered 80%-diameter circle) -->
  <g transform="translate(256 256) scale(0.72) translate(-248 -274)">
    <g stroke="#e8edf5" stroke-opacity="0.11" stroke-width="10" stroke-linecap="round">
      <line x1="72" y1="150" x2="200" y2="150"/>
      <line x1="72" y1="196" x2="176" y2="196"/>
    </g>
    <path d="M 72 380 L 180 272 L 246 326 L 424 124 L 424 424 L 72 424 Z" fill="url(#area)" mask="url(#areaFade)"/>
    <path d="M 72 380 L 180 272 L 246 326 L 424 124"
          fill="none" stroke="url(#line)" stroke-width="36"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="424" cy="124" r="46" fill="#0b0d12" opacity="0.4"/>
    <circle cx="424" cy="124" r="42" fill="url(#dot)"/>
    <circle cx="424" cy="124" r="42" fill="none" stroke="#34d399" stroke-width="7" opacity="0.5"/>
  </g>
</svg>
